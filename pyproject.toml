[build-system]
  requires = ["setuptools>=68"]
  build-backend = "setuptools.build_meta"

  [project]
  name = "xr-marvin-teleop"
  version = "0.1.0"
  requires-python = ">=3.10"
  dependencies = [
    "mujoco",
    "numpy",
    "mcap>=1.2",
    "foxglove-schemas-protobuf>=0.3",
  ]

  [project.optional-dependencies]
  video = ["av>=12"]
  lerobot = ["pyarrow>=14"]

  [tool.setuptools.packages.find]
  where = ["src"]

