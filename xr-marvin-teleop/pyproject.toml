[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xr-marvin-teleop"
version = "0.1.0"
description = "Minimal PICO XR teleoperation for Marvin dual arms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mujoco", "numpy"]

[tool.setuptools.packages.find]
include = ["xr_marvin_teleop*"]
